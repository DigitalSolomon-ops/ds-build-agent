name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      # npm test compiles first (tsc), then runs the offline node:test suites
      # and the three compiled-harness verify drives (no agents, no API, no cost).
      - run: npm test
